
name: Telegram Group Auto Lock Unlock

on:
  schedule:
    - cron: "55 9 * * *"
      timezone: "Asia/Dhaka"
    - cron: "55 17 * * *"
      timezone: "Asia/Dhaka"

  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a test action"
        required: true
        type: choice
        options:
          - unlock
          - lock

permissions:
  contents: read

jobs:
  update-group:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose action
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.mode }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "mode=$DISPATCH_MODE" >> "$GITHUB_OUTPUT"

          elif [[ "$SCHEDULE" == "55 9 * * *" ]]; then
            echo "mode=unlock" >> "$GITHUB_OUTPUT"

          elif [[ "$SCHEDULE" == "55 17 * * *" ]]; then
            echo "mode=lock" >> "$GITHUB_OUTPUT"

          else
            echo "Unknown trigger: $SCHEDULE" >&2
            exit 1
          fi

      - name: Wait until target Bangladesh time
        if: github.event_name == 'schedule'
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$SCHEDULE" == "55 9 * * *" ]]; then
            TARGET="10:00"
          elif [[ "$SCHEDULE" == "55 17 * * *" ]]; then
            TARGET="18:00"
          else
            echo "Unknown schedule" >&2
            exit 1
          fi

          TARGET_EPOCH=$(TZ=Asia/Dhaka date -d "today $TARGET" +%s)
          NOW_EPOCH=$(date +%s)

          if (( NOW_EPOCH < TARGET_EPOCH )); then
            WAIT_SECONDS=$((TARGET_EPOCH - NOW_EPOCH))
            echo "Waiting $WAIT_SECONDS seconds until $TARGET Bangladesh time"
            sleep "$WAIT_SECONDS"
          else
            echo "Target time has passed; running immediately"
          fi

      - name: Run Telegram bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python bot.py
